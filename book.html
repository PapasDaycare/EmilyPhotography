<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Book a photography session with Emily — portraits, couples, and events across Northern Michigan.">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a Session | Emily Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="styles.css?v=4" as="style" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles.css?v=4" /></noscript>
  <link rel="icon" href="/images/logo.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

<header>
  <div class="container nav">
    <nav class="nav">
      <a class="brand" href="index.html" aria-label="Emily Photography home">
        <span>Emily Photography<small>Modern • Timeless • True-to-you</small></span>
      </a>

      <button class="burger" type="button" aria-label="Toggle navigation" aria-controls="primary-nav" aria-expanded="false"><span></span></button>

      <div id="primary-nav" class="navlinks" role="navigation" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="about.html">About</a>
      </div>

      <div class="nav-cta">
<a class="btn dark" href="book.html" aria-current="page">Book a Session</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section">
    <div class="container">
      <h1>Book a Session</h1>
      <p>Please fill out the form below and I’ll be in touch shortly.</p>

      <div class="formEmbed">
<iframe
  src="https://docs.google.com/forms/d/e/1dLLGBq3j_vy1_t-lJiCPmes0ni3bmkCW6o3b/viewform?embedded=true"
  title="Booking form"
  loading="lazy"
  style="width:100%; min-height:800px; border:0;">
  Loading…
</iframe>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p style="margin:0; padding:18px 0; color:#64748b;">
      © <span id="year"></span> Emily Photography
    </p>
  </div>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  (function(){
    const burger = document.querySelector('.burger');
    const container = document.querySelector('.container.nav');
    if (!burger || !container) return;
    function update(open){ burger.setAttribute('aria-expanded', String(open)); container.classList.toggle('nav-open', !!open); }
    burger.addEventListener('click', ()=>{ update(burger.getAttribute('aria-expanded') !== 'true'); });
    document.querySelectorAll('.navlinks a').forEach(a => a.addEventListener('click', ()=>{ update(false); }));
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && container.classList.contains('nav-open')){ update(false); }});
  })();
</script>

</body>
</html>
